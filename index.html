<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>القائمة الرقمية</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>tailwind.config = { theme: { extend: { colors: { accent: '#FF6B00', card: '#1E1E1E' } } } }</script>
<style>
  body { font-family: 'Cairo', sans-serif; background: #121212; color: #fff; }
  .no-sb::-webkit-scrollbar { display: none } .no-sb { scrollbar-width: none }
  .field { width: 100%; background: #1E1E1E; border: 1px solid #2c2c2c; border-radius: .75rem; padding: .75rem 1rem; outline: none }
  .field:focus { border-color: #FF6B00 }
  .tbtn { padding: .75rem; border-radius: .75rem; background: #1E1E1E; border: 1px solid #2c2c2c; font-weight: 600 }
  .tbtn.on { background: #FF6B00; border-color: #FF6B00 }
  button:focus-visible, a:focus-visible { outline: 2px solid #FF6B00; outline-offset: 2px }
</style>
</head>
<body class="pb-28">

<header>
  <div class="relative h-48 md:h-64">
    <img id="cover" alt="" class="w-full h-full object-cover opacity-70">
    <div class="absolute inset-0 bg-gradient-to-t from-[#121212] to-transparent"></div>
  </div>
  <div class="max-w-6xl mx-auto px-4 -mt-14 relative flex items-end gap-4">
    <img id="logo" alt="" class="w-24 h-24 rounded-full border-4 border-[#121212] object-cover bg-card">
    <div class="pb-1">
      <h1 id="rname" class="text-2xl font-extrabold"></h1>
      <div class="flex flex-wrap items-center gap-3 text-sm text-gray-400 mt-1">
        <span id="status" class="px-3 py-0.5 rounded-full text-xs font-bold text-white"></span>
        <span><i class="fa-regular fa-clock ml-1"></i><span id="hours"></span></span>
      </div>
    </div>
  </div>
  <div id="social" class="max-w-6xl mx-auto px-4 mt-3 flex gap-2"></div>
</header>

<nav class="sticky top-0 z-30 bg-[#121212]/95 backdrop-blur py-3 mt-4 border-b border-white/5">
  <div class="max-w-6xl mx-auto px-4 space-y-3">
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute right-4 top-3.5 text-gray-500"></i>
      <input id="search" type="search" placeholder="ابحث عن وجبتك..." class="field !rounded-full !pr-11">
    </div>
    <div id="cats" class="flex gap-2 overflow-x-auto no-sb"></div>
  </div>
</nav>

<main id="menu" class="max-w-6xl mx-auto px-4 py-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></main>

<!-- Floating cart bar -->
<div id="bar" class="hidden fixed bottom-0 inset-x-0 z-40 p-3">
  <button onclick="openCart()" class="max-w-xl mx-auto w-full bg-accent rounded-2xl px-4 py-3 flex items-center justify-between gap-2 shadow-2xl font-bold">
    <span id="barCount" class="bg-black/25 rounded-full px-3 py-1 text-sm"></span>
    <span>عرض السلة وإتمام الطلب</span>
    <span id="barTotal" class="text-sm"></span>
  </button>
</div>

<!-- Cart drawer -->
<div id="drawer" class="hidden fixed inset-0 z-50">
  <div onclick="closeCart()" class="absolute inset-0 bg-black/70"></div>
  <div id="sheet" class="absolute bottom-0 inset-x-0 max-w-xl mx-auto bg-[#181818] rounded-t-3xl max-h-[92vh] overflow-y-auto p-5 translate-y-full transition-transform duration-300">
    <div class="flex justify-between items-center mb-2">
      <h2 class="text-xl font-bold">سلة الطلبات</h2>
      <button onclick="closeCart()" aria-label="إغلاق" class="text-3xl leading-none text-gray-400">&times;</button>
    </div>
    <div id="cartList"></div>
    <div class="flex justify-between font-bold text-lg py-3"><span>المجموع</span><span id="cartTotal" class="text-accent"></span></div>

    <div class="grid grid-cols-2 gap-2 mb-4">
      <button id="t-delivery" onclick="setType('delivery')" class="tbtn on"><i class="fa-solid fa-motorcycle ml-1"></i>توصيل للمنزل</button>
      <button id="t-pickup" onclick="setType('pickup')" class="tbtn"><i class="fa-solid fa-store ml-1"></i>استلام من المطعم</button>
    </div>

    <div class="space-y-3">
      <input id="name" class="field" placeholder="الاسم الكامل" autocomplete="name">
      <input id="phone" class="field" type="tel" placeholder="رقم الهاتف (07xxxxxxxxx)" autocomplete="tel">
      <div id="delBox" class="space-y-3">
        <textarea id="addr" rows="2" class="field" placeholder="العنوان بالتفصيل / أقرب نقطة دالة"></textarea>
        <button id="gpsBtn" onclick="locate()" class="w-full border border-accent text-accent rounded-xl py-3 font-semibold">
          <i class="fa-solid fa-location-crosshairs ml-1"></i>تحديد موقعي الحالي (GPS)
        </button>
      </div>
      <textarea id="notes" rows="2" class="field" placeholder="ملاحظات إضافية (مثال: بدون مخلل، كثر ثوميه)"></textarea>
      <p id="err" class="hidden text-red-400 text-sm"></p>
      <button onclick="send()" class="w-full bg-[#25D366] text-black rounded-xl py-3.5 font-bold text-lg">
        <i class="fa-brands fa-whatsapp ml-1"></i>إرسال الطلب عبر واتساب
      </button>
      <p id="delNote" class="text-xs text-gray-500 text-center">المجموع لا يشمل كلفة التوصيل</p>
    </div>
  </div>
</div>

<script src="menu-data.js"></script>
<script src="app.js"></script>
</body>
</html>
